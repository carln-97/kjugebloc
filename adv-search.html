<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Search – KjugeBloc</title>
  <link rel="icon" href="images/logo/tab_icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,100;1,300;1,400;1,500;1,700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
</head>
<body class="adv-search">
  <header class="site-header">
    <div class="header-content">
      <div class="site-branding">
        <a href="index.html">
          <img src="images/logo/front-icon_rocks.png" alt="KjugeBloc logo" class="logo">
        </a>
        <h1>KjugeBloc</h1>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="access.html">Access</a></li>
          <li><a href="area-index.html">Area Index</a></li>
          <li><a href="map.html">Map</a></li>
          <li><a href="store.html">Store</a></li>
          <li style="padding-right: 10px;">
            <a href="#" id="search-trigger">
              <img src="images/logo/search-icon.png" alt="Search" style="height: 18px; vertical-align: middle;">
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="search-section">
    <h2>Detailed Problem Search</h2>

    <!-- Labels Row -->
    <div class="filter-row" style="display: flex; gap: 40px; align-items: flex-start;">
      <div class="filter-label" style="text-align: left; width: 160px;">Naming</div>
      <div class="filter-label" style="text-align: left; width: 160px;">Grade Range</div>
      <div class="filter-label" style="text-align: left; width: 160px; margin-left: 5px;">Attributes</div>
    </div>

    <!-- Inputs Row -->
    <div class="filter-row" style="display: flex; gap: 50px; align-items: center;">
      <input type="text" id="name-filter" placeholder="ex. Moby Dick" />

      <div style="width: 160px; display: flex; flex-direction: column; align-items: center; margin-top: 10px;">
        <div id="grade-slider" style="width: 100%;"></div>
        <div id="grade-range-display">L – 8C</div>
      </div>

      <div style="width: 160px; display: flex; gap: 10px; justify-content: flex-start;">
        <span class="icon-toggle" id="toggle-expo">!</span>
        <span class="icon-toggle" id="toggle-hollow">☆</span>
        <span class="icon-toggle" id="toggle-full">★</span>
      </div>
    </div>

    <div style="height: 30px;"></div>

    <div class="filter-group">
      <label class="filter-label">Region</label>
      <select id="region-select">
        <option value="">-- Select Region --</option>
      </select>
    </div>

    <!-- Area -->
    <div class="filter-group">
      <label class="filter-label">Area</label>
      <select id="area-select"></select>
    </div>

    <!-- Sector -->
    <div class="filter-group sector-dropdown" id="sector-group">
      <label class="filter-label">Sector</label>
      <select id="sector-select"></select>
    </div>

    <div style="height: 30px;"></div>

    <!-- Styles -->
    <div class="filter-group">
      <label class="filter-label">Styles</label>
      <div style="height: 10px;"></div>
      <div id="styles-container"></div>
    </div>

    <div style="height: 30px;"></div>

    <!-- Submit -->
    <button id="search-button">Search</button>
    <div id="adv-search-results"></div>

  </main>

  <footer>
    <p>© 2025 <b>KjugeBloc</b></p>
    <p>
      <a href="mailto:kjugebloc@gmail.com" style="color: inherit;">
        kjugebloc@gmail.com
      </a>
    </p>
  </footer>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.querySelector('footer').style.visibility = 'visible';
      }, 1000); // delay in milliseconds
    });
  </script>


  <script src="adv-search.js"></script>
  <script src="search.js"></script>

</body>
</html>
