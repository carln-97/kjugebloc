<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,100;1,300;1,400;1,500;1,700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/logo/tab_icon.png" type="image/png" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body class="area-page">
  <header class="site-header">
    <div class="header-content">
      <div class="site-branding">
        <a href="index.html">
          <img src="images/logo/front-icon_rocks.png" alt="KjugeBloc logo" class="logo">
        </a>
        <h1>KjugeBloc</h1>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="access.html">Access</a></li>
          <li><a href="area-index.html" class="active">Area Index</a></li>
          <li><a href="map.html">Map</a></li>
          <li><a href="store.html">Store</a></li>
          <li style="padding-right: 10px;">
            <a href="#" id="search-trigger">
              <img src="images/logo/search-icon.png" alt="Search" style="height: 18px; vertical-align: middle;">
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1><span id="area-title">Loading area...</span> <a id="map-zoom-link" href="#" title="View on Map" class="map-symbol hidden" style="font-size: 20px; margin-left: 10px; text-decoration: none;">🧭</a></h1>
    <div class="area-layout">
      <div class="area-content-row">
        <div class="area-text" id="area-text" style="display: none;">Loading description...</div>
        <div class="chart-wrapper">
          <canvas id="gradeChart" width="300" height="200"></canvas>
        </div>
      </div>
      <div class="problems-and-image-row">
        <div class="area-left">
          <div id="sort-toggle-wrapper" style="display: none; margin-bottom: 20px;">
            <span id="sort-toggle" style="font-size: 14px; cursor: pointer; color: #777;">
              <strong>Sort by:</strong> 
              <span id="sort-grade" style="text-decoration: underline;">grades</span> | 
                <span id="sort-bloc" style="text-decoration: none;">bloc groupings</span> | 
                <span id="sort-year" style="text-decoration: none;">year</span>
                <span id="sort-circuit-placeholder"></span>
            </span>
          </div>
          <section id="problems-section"></section>
        </div>
          <div class="area-right" id="area-visual" style="display: none;">
            <img id="area-image" alt="Area photo" />
            <div id="area-caption">
              <div id="area-description"></div>
              <div id="area-photographer"></div>
            </div>
          </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2025 <b>KjugeBloc</b></p>
    <p>
      <a href="mailto:kjugebloc@gmail.com" style="color: inherit;">
        kjugebloc@gmail.com
      </a>
    </p>
  </footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const areaName = params.get('area');
  if (areaName) {
    document.title = `${areaName}`;
  }

  let loadingStates = {
    image: false,
    text: false,
    problems: false
  };

  window.addEventListener("load", () => {
    loadAreaImageFromCSV(areaName);
  });

  function checkAndShowContent() {
    if (loadingStates.image && loadingStates.text && loadingStates.problems) {
      const areaImg = document.getElementById('area-image');
      const textContainer = document.getElementById('area-text');
      const visualEl = document.getElementById('area-visual');
      const captionEl = document.getElementById('area-caption');
      const row = document.querySelector('.area-content-row');

      const hasImage = areaImg.complete && areaImg.naturalWidth > 0;
      const hasText = textContainer.textContent && textContainer.textContent !== 'Loading description...';

      // Ensure image/text visibility is set only now
      areaImg.style.display = hasImage ? 'block' : 'none';
      textContainer.style.display = hasText ? 'block' : 'none';

      if (hasImage || hasText) {
        visualEl.style.display = 'flex';
      }

      captionEl.style.display = (hasImage && hasText) ? 'block' : 'none';

      if (!hasText) row.classList.add('only-chart');

      const sortToggle = document.getElementById('sort-toggle-wrapper');
      if (sortToggle) sortToggle.style.display = 'block';
    }
  }

  function sanitizeName(name) {
    return name
      .replace(/\s+/g, '_')
      .replace(/Å|Ä/g, 'A')
      .replace(/Ö/g, 'O')
      .replace(/å|ä/g, 'a')
      .replace(/ö/g, 'o');
  }

  function toDirectImgurURL(url) {
    const match = url.match(/imgur\.com\/([a-zA-Z0-9]+)(\.\w+)?/);
    if (match) {
      const ext = match[2] || '.jpg';
      return `https://i.imgur.com/${match[1]}${ext}`;
    }
    return url;
  }

function loadAreaImageFromCSV(areaName) {
  const visualEl = document.getElementById('area-visual');
  const areaImg = document.getElementById('area-image');
  const descriptionEl = document.getElementById('area-description');
  const photographerEl = document.getElementById('area-photographer');
  const captionEl = document.getElementById('area-caption');

  fetch('images/area-photos/area-photos.csv')
    .then(res => res.text())
    .then(csv => {
      const lines = csv.trim().split('\n');
      lines.shift(); // remove header

      let found = false;

      for (const line of lines) {
        const [csvArea, link, desc, photo] = line.split(',').map(s => s.trim());

        if (csvArea.toLowerCase() === areaName.toLowerCase()) {
          found = true;

          descriptionEl.textContent = desc || '';
          photographerEl.textContent = photo ? `Photo: ${photo}` : '';

          areaImg.onload = () => {
            loadingStates.image = true;
            checkAndShowContent();
          };

          areaImg.onerror = () => {
            areaImg.style.display = 'none';
            captionEl.style.display = 'none';
            loadingStates.image = true;
            checkAndShowContent();
          };

          areaImg.src = toDirectImgurURL(link);
          areaImg.alt = desc || '';

          return;
        }
      }

      if (!found) {
        areaImg.style.display = 'none';
        captionEl.style.display = 'none';
        loadingStates.image = true;
        checkAndShowContent();
      }
    })
    .catch(err => {
      console.error('Failed to load area image:', err);
      areaImg.style.display = 'none';
      captionEl.style.display = 'none';
      loadingStates.image = true;
      checkAndShowContent();
    });
}


  const areaTextPath = `text/area-text/${sanitizeName(areaName)}.txt`;
  fetch(areaTextPath)
    .then(res => res.ok ? res.text() : '')
    .then(text => {
      const textContainer = document.getElementById('area-text');
      const formatted = text.trim().split(/\n\s*\n/).map(p => {
        let cleaned = p.trim();

        // Italicized quotes: "text"
        cleaned = cleaned.replace(/"(.*?)"/g, (_, match) =>
          `<span style="font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 14px;">${match}</span>`
        );

        // Bold brackets: [text]
        cleaned = cleaned.replace(/\[(.*?)\]/g, (_, match) =>
          `<span style="font-weight: bold;">${match}</span>`
        );

        // Highlighted orange-emphasis: !!text!!
        cleaned = cleaned.replace(/!!(.*?)!!/g, (_, match) =>
          `<span style="font-weight: bold; font-style: italic; color: #f79646;">${match}</span>`
        );

        return `<p>${cleaned}</p>`;
      }).join('');

      textContainer.innerHTML = formatted;

      loadingStates.text = true;
      checkAndShowContent();
    })
    .catch(() => {
      document.getElementById('area-text').textContent = '';
      loadingStates.text = true;
      checkAndShowContent();
    });

  const areaTitleEl = document.getElementById('area-title');
  const mapLink = document.getElementById('map-zoom-link');
  areaTitleEl.textContent = areaName || 'Unknown Area';
  mapLink.classList.add('hidden');

  const sheetId = '1VwZM08gTUNHlpWGDaBUWnYdiqgUFicWoD3fDJJwE7rU';
  const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=databas`;

  Promise.all([
    fetch(sheetUrl).then(res => res.text()),
    fetch('map/sectors.csv').then(res => res.text())
  ])
  .then(([sheetText, csvText]) => {
    const sheetJson = JSON.parse(sheetText.substring(47).slice(0, -2));
    const rows = sheetJson.table.rows;

    const sectorSet = new Set(
      csvText.trim().split('\n').slice(1)
        .map(line => {
          const name = line.split(',')[0].trim();
          return name.startsWith('Parking') ? name : (name.split(' – ')[1] || name);
        })
    );

    const matchingSectors = new Set();
    const problemsByGrade = {};

    rows.forEach(row => {
      const cols = row.c;
      const area = cols[2]?.v?.trim();
      const sector = cols[3]?.v?.trim();
      const bloc = cols[4]?.v?.trim() || '_no_bloc';
      const name = cols[8]?.v;
      const grade = cols[9]?.v;
      const rawOrder = (cols[5]?.v ?? '').toString().trim();
      let numericOrder = Infinity;

      if (rawOrder) {
        const normalized = rawOrder.replace(',', '.');
        const parsed = parseFloat(normalized);
        if (!isNaN(parsed)) numericOrder = parsed;
      }

      if (area === areaName && sector && sectorSet.has(sector)) {
        matchingSectors.add(sector);
      }

      if (!name) console.warn('Missing name for problem:', row);

      if (area === areaName && name && grade) {
        const rating = cols[12]?.v || '';
        problemsByGrade[grade] ??= [];
        const yearRaw = cols[16]?.v?.toString().trim() || '';
        const yearSort = parseInt(yearRaw);
        const yearLabel = yearRaw || '–';
        problemsByGrade[grade].push({
          name,
          grade,
          expo: cols[11]?.v || '',
          rating,
          faYear: {
            main: cols[15]?.v?.toString().trim() || '',
            year: cols[16]?.v?.toString().trim() || ''
          },
          yearSort,
          yearLabel,
          circ: cols[7]?.v || '',
          starScore: rating === '★' ? 2 : rating === '☆' ? 1 : 0,
          imageFiles: cols[18]?.v || '',
          videoLink: cols[17]?.v || '',
          bloc,
          order: numericOrder,
          sector
        });
      }
    });

    if (matchingSectors.size > 0) {
      mapLink.href = `map.html?area=${encodeURIComponent(areaName)}`;
      mapLink.classList.remove('hidden');
    }

    const gradeOrder = ['P','8C','8B+','8B','8A+','8A','7C+','7C','7B+','7B','7A+','7A','6C+','6C','6B+','6B','6A+','6A','5+','5','L','–'];
    const sortedGrades = Object.keys(problemsByGrade).sort((a, b) =>
      (gradeOrder.indexOf(a) === -1 ? 999 : gradeOrder.indexOf(a)) -
      (gradeOrder.indexOf(b) === -1 ? 999 : gradeOrder.indexOf(b))
    );

    const section = document.getElementById('problems-section');
    let currentSort = 'grade'; // default sort

    function renderProblems() {
      section.innerHTML = ''; // clear existing

      // Add 'circuits' link if any climb has a circuit value
      const hasCircuit = Object.values(problemsByGrade)
        .flat()
        .some(p => p.circ && p.circ !== '-');

      if (hasCircuit) {
        const placeholder = document.getElementById('sort-circuit-placeholder');
        placeholder.innerHTML = ` | <a href="circuit.html?area=${encodeURIComponent(areaName)}" style="color: #777; text-decoration: none;">circuits</a>`;
      }

      if (currentSort === 'grade') {
        sortedGrades.forEach(grade => {
          const header = document.createElement('h2');
          header.textContent = grade;
          section.appendChild(header);

          const list = document.createElement('ul');
          problemsByGrade[grade].sort((a, b) =>
            b.starScore - a.starScore || a.name.localeCompare(b.name)
          ).forEach(problem => list.appendChild(renderProblemRow(problem, grade)));
          section.appendChild(list);
        });

      } else if (currentSort === 'year') {
        const groupedByYear = {};
        Object.values(problemsByGrade).flat().forEach(p => {
          const key = p.yearLabel || '–';
          groupedByYear[key] ??= [];
          groupedByYear[key].push(p);
        });

        const sortedYearKeys = Object.keys(groupedByYear).sort((a, b) => {
          const aNum = parseInt(a);
          const bNum = parseInt(b);
          return (isNaN(aNum) ? Infinity : aNum) - (isNaN(bNum) ? Infinity : bNum);
        });

        sortedYearKeys.forEach(year => {
          const header = document.createElement('h2');
          header.textContent = year;
          section.appendChild(header);

          const list = document.createElement('ul');
          groupedByYear[year].sort((a, b) =>
            a.order - b.order || b.starScore - a.starScore || a.name.localeCompare(b.name)
          ).forEach(problem => list.appendChild(renderProblemRow(problem)));

          section.appendChild(list);
        });

      } else {
        const grouped = {};
        const sectorTracker = new Set();

        Object.values(problemsByGrade).flat().forEach(p => {
          const key = p.bloc || '_no_bloc';
          grouped[key] ??= [];
          grouped[key].push(p);
        });

        const sortedBlocs = Object.keys(grouped).sort((a, b) => {
          const parse = str => {
            const match = str.match(/^(\d+)([A-Z]*)$/i);
            if (!match) return [Infinity, ''];
            return [parseInt(match[1]), match[2] || ''];
          };

          const [aNum, aSuffix] = parse(a);
          const [bNum, bSuffix] = parse(b);

          if (aNum !== bNum) return aNum - bNum;
          return aSuffix.localeCompare(bSuffix);
        });

        sortedBlocs.forEach(bloc => {
          const problems = grouped[bloc];
          if (!problems.length) return;

          const sector = problems[0].sector;
          if (sector && !sectorTracker.has(sector)) {
            const sectorHeader = document.createElement('h2');
            const sectorLink = document.createElement('a');
            sectorLink.href = `sector.html?sector=${encodeURIComponent(sector)}`;
            sectorLink.textContent = sector;
            sectorLink.style.textDecoration = 'none';
            sectorLink.style.color = 'inherit';
            sectorHeader.appendChild(sectorLink);
            section.appendChild(sectorHeader);
            sectorTracker.add(sector);
          }

          const list = document.createElement('ul');
          problems.sort((a, b) =>
            a.order - b.order || b.starScore - a.starScore || a.name.localeCompare(b.name)
          ).forEach(problem => list.appendChild(renderProblemRow(problem, problem.grade)));

          section.appendChild(list);
          const spacer = document.createElement('div');
          spacer.style.height = '0px';
          section.appendChild(spacer);
        });
      }
    }

    function renderProblemRow(problem, gradeOverride) {
      const li = document.createElement('li');
      const hasMedia = problem.imageFiles.trim() || problem.videoLink.trim();
      const cameraIcon = hasMedia ? '📷' : '';
      const isPGrade = (gradeOverride || problem.grade) === 'P';
      const nameStyle = isPGrade ? 'style="color: #999999;"' : '';

      li.innerHTML = `
        <div class="problem-row">
          <span class="camera-icon">${cameraIcon}</span>
          <div class="name-meta-combo">
            <a href="problem.html?name=${encodeURIComponent(problem.name)}" class="problem-name-link">
              <strong ${nameStyle}>${problem.name}</strong>
            </a>
            <span class="problem-meta">
              <span class="rating">${problem.rating}</span>
              <span class="expo">${problem.expo}</span>
              ${currentSort === 'year' && problem.faYear.main
                ? `<span class="fa-year">${problem.faYear.main}</span>`
                : currentSort !== 'year' && (problem.faYear.main || problem.faYear.year)
                  ? `<span class="fa-year">${problem.faYear.main}${problem.faYear.main && problem.faYear.year ? ', ' : ''}${problem.faYear.year}</span>`
                  : ''
              }
            </span>
          </div>
        </div>
      `;

      return li;
    }

    const categories = {
      'L': ['L'], '5': ['5', '5+'], '6A': ['6A', '6A+'], '6B': ['6B', '6B+'],
      '6C': ['6C', '6C+'], '7A': ['7A', '7A+'], '7B': ['7B', '7B+'],
      '7C': ['7C', '7C+'], '8A': ['8A', '8A+'], '8B': ['8B', '8B+'], '8C': ['8C']
    };
    const fullLabels = ['L', '5', '6A', '6B', '6C', '7A', '7B', '7C', '8A', '8B', '8C'];
    const visibleLabels = [], visibleData = [];

    fullLabels.forEach(label => {
      const count = categories[label].reduce((sum, g) => sum + (problemsByGrade[g]?.length || 0), 0);
      if (count > 0) {
        visibleLabels.push(label);
        visibleData.push(count);
      }
    });

    let total = visibleData.reduce((sum, val) => sum + val, 0);
    if (problemsByGrade['–']) total += problemsByGrade['–'].length;

    const totalLabelPlugin = {
      id: 'totalLabel',
      afterDraw(chart) {
        const { ctx, chartArea: { top, right } } = chart;
        ctx.save();
        ctx.font = '45px Roboto';
        ctx.fillStyle = '#999999';
        ctx.textAlign = 'right';
        ctx.fillText(`${total}`, right - 8, top + 20);
        ctx.restore();
      }
    };

    const baseHue = 42, baseSaturation = 98, startLightness = 62, endLightness = 30;
    const steps = visibleLabels.length;
    const backgroundColors = visibleLabels.map((_, i) => {
      const lightness = startLightness - ((startLightness - endLightness) * (i / (steps - 1)));
      return `hsl(${baseHue}, ${baseSaturation}%, ${lightness}%)`;
    });

    const ctx = document.getElementById('gradeChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: visibleLabels,
        datasets: [{
          data: visibleData,
          backgroundColor: backgroundColors
        }]
      },
      options: {
        maintainAspectRatio: false,
        responsive: true,
        layout: { padding: { top: 20 } },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
          datalabels: {
            anchor: 'end',
            align: 'end',
            color: '#aaa',
            font: { weight: 400, size: 12 }
          }
        },
        scales: {
          x: {
            ticks: { color: '#aaa', font: { weight: 500, size: 12 } },
            grid: { display: false }
          },
          y: { beginAtZero: true, display: false }
        }
      },
      plugins: [ChartDataLabels, totalLabelPlugin]
    });

    function updateSortSelection(selected) {
      document.getElementById('sort-grade').style.textDecoration = selected === 'grade' ? 'underline' : 'none';
      document.getElementById('sort-bloc').style.textDecoration = selected === 'bloc' ? 'underline' : 'none';
      document.getElementById('sort-year').style.textDecoration = selected === 'year' ? 'underline' : 'none';
    }

    document.getElementById('sort-grade').addEventListener('click', () => {
      currentSort = 'grade';
      updateSortSelection('grade');
      renderProblems();
    });

    document.getElementById('sort-bloc').addEventListener('click', () => {
      currentSort = 'bloc';
      updateSortSelection('bloc');
      renderProblems();
    });

    document.getElementById('sort-year').addEventListener('click', () => {
      currentSort = 'year';
      updateSortSelection('year');
      renderProblems();
    });

    loadingStates.problems = true;
    checkAndShowContent();
    renderProblems();
  })
  .catch(err => {
    console.error('Error loading data:', err);
    document.getElementById('problems-section').innerHTML = '<p style="color: red;">Failed to load problems.</p>';
    loadingStates.problems = true;
    checkAndShowContent();
  });
</script>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.querySelector('footer').style.visibility = 'visible';
    }, 1000); // delay in milliseconds (e.g. 500 = 0.5 sec)
  });
</script>

  <script src="search.js"></script>
  
</body>
</html>
