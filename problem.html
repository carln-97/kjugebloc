<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Problem Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,100;1,300;1,400;1,500;1,700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
  <link rel="icon" href="images/logo/tab_icon.png" type="image/png" />
</head>
<body class="problem-page">
  <header class="site-header">
    <div class="header-content">
      <div class="site-branding">
        <a href="index.html">
          <img src="images/logo/front-icon_rocks.png" alt="KjugeBloc logo" class="logo">
        </a>
        <h1>KjugeBloc</h1>
      </div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="access.html">Access</a></li>
          <li><a href="area-index.html" class="active">Area Index</a></li>
          <li><a href="map.html">Map</a></li>
          <li><a href="store.html">Store</a></li>
          <li style="padding-right: 10px;">
            <a href="#" id="search-trigger">
              <img src="images/logo/search-icon.png" alt="Search" style="height: 18px; vertical-align: middle;">
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="problem-layout">
    <div class="problem-text">
      <p class="area-name-label hidden" id="area-name-wrapper">
        <span class="area-prefix">» </span><a id="area-name-label" class="area-link" href="#"></a>
          <span id="sector-separator" class="breadcrumb-separator" style="display: none;">//</span><a id="sector-name-label" class="area-link" href="#"></a>
      </p>
      <h1 id="problem-name">Loading...</h1>
      <p id="fa-name" class="fa-name"></p>
      <p id="problem-description" class="problem-description"></p>
      <p id="problem-additional" class="problem-additional"></p>
    </div>

    <div class="problem-images-container">
      <div id="problem-images"></div>
    </div>
  </main>

    <footer class="site-footer">
      <p>© 2025 KjugeBloc</p>
    </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const problemName = urlParams.get('name');
    if (problemName) {
      document.title = `${problemName}`;
    }

    const sheetId = '1VwZM08gTUNHlpWGDaBUWnYdiqgUFicWoD3fDJJwE7rU';
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=databas`;

    let imageList = [];
    let captionList = [];
    let currentImageIndex = 0;

    function toDirectImgurURL(url) {
      const match = url.match(/imgur\.com\/([a-zA-Z0-9]+)(\.\w+)?/);
      if (match) {
        const ext = match[2] || '.jpg'; // default to .jpg if no extension
        return `https://i.imgur.com/${match[1]}${ext}`;
      }
      return url;
    }

    function showImage(index) {
      const lightboxImg = document.getElementById('lightbox-img');
      const caption = document.getElementById('lightbox-caption');

      if (imageList[index]) {
        lightboxImg.src = toDirectImgurURL(imageList[index]);
        const rawCaption = captionList[index] || '';
        const climberMatch = rawCaption.match(/\bClimber:\s*([^\n,]+)/i);
        const photoMatch = rawCaption.match(/Photo:\s*([^\n]+)/i);

        let climberHTML = '';
        if (climberMatch) {
          const climberText = climberMatch[1].trim();
          const [climberName, rest] = climberText.split(/\s+on\s+/, 2);  // splits into name and rest

          const faLink = `person.html?name=${encodeURIComponent(climberName)}`;
          const nameHTML = `<a href="${faLink}" class="caption-name-link">${climberName}</a>`;
          const restText = rest ? ` on ${rest}` : '';

          climberHTML = `<div><strong>Climber:</strong> ${nameHTML}${restText}</div>`;
        }

        let photoHTML = '';
        if (photoMatch) {
          const photographer = photoMatch[1].trim();
          photoHTML = `<div style="text-align: center; color: #888;"><strong>Photo:</strong> ${photographer}</div>`;
        }

        caption.innerHTML = climberHTML + photoHTML;
        document.getElementById('lightbox').style.display = 'flex';
        currentImageIndex = index;
      }
    }

    fetch(url)
      .then(res => res.text())
      .then(data => {
        const json = JSON.parse(data.substring(47).slice(0, -2));
        const rows = json.table.rows;

        const problem = rows.map(r => r.c).find(cols => cols[8]?.v === problemName);
        if (!problem) return;

        const name = problem[8]?.v || 'Unknown';
        const grade = problem[9]?.v || '–';
        const rating = problem[12]?.v || '';
        const expo = problem[11]?.v || '';
        const description = problem[14]?.v || '';
        const area = problem[2]?.v || '';
        const areaNameEl = document.getElementById('area-name-label');
        const wrapper = document.getElementById('area-name-wrapper');
        if (area && areaNameEl) {
          areaNameEl.textContent = area;
          areaNameEl.href = `area.html?area=${encodeURIComponent(area)}`;
          wrapper.classList.remove('hidden');
        }
        const sector = problem[3]?.v || '';
        const sectorNameEl = document.getElementById('sector-name-label');
        const sectorSeparator = document.getElementById('sector-separator');

        if (sector && sectorNameEl) {
          sectorNameEl.textContent = sector;
          sectorNameEl.href = `sector.html?sector=${encodeURIComponent(sector)}`;
          sectorSeparator.style.display = 'inline';
        }
        document.getElementById('problem-name').innerHTML = `
          ${name} 
          <span class="problem-meta-inline">
            <span class="grade-inline">${grade}</span>
            <span class="rating-inline">${rating}</span>
            <span class="expo-inline">${expo}</span>
          </span>
        `;

        const formattedDescription = description.replace(/"(.*?)"/g, (_, match) =>
          `<span style="font-family: 'Libre Baskerville', serif; font-style: italic;">${match}</span>`
        );
        document.getElementById('problem-description').innerHTML = formattedDescription;

        const faName = problem[15]?.v || '';
        const Year = problem[16]?.f || problem[16]?.v || '';
        console.log('Raw year:', Year);
        const faNameEl = document.getElementById('fa-name');

        if (faNameEl) {
          if (faName || Year) {
            let content = '';

            if (faName) {
              const faNames = faName.split(',').map(s => s.trim()).filter(Boolean);
              content += faNames.map(name => {
                const cleanName = name.replace(/^\(|\)$/g, '').trim(); // for linking
                return `<a href="person.html?name=${encodeURIComponent(cleanName)}" class="fa-name-link">${name}</a>`;
              }).join(', ');
            }

            if (Year) {
              content += `<span style="margin-left: 10px;">${Year}</span>`;
            }

            faNameEl.innerHTML = content;
            console.log('FA display content:', content);
          } else {
            faNameEl.textContent = '–';
          }
        }

        const rawStyles = (problem[21]?.v || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);

        if (rawStyles.length) {
          const categories = {
            form: ['arete', 'bulge', 'crack', 'dihedral', 'dyno', 'mantle', 'overhang', 'prow', 'pillar', 'roof', 'slab', 'slightly overhanging', 'traverse', 'wall'],
            holds: ['edges', 'compression', 'pockets', 'slopers', 'underclings'],
            other: ['morpho', 'lowball', 'seeping', 'game']
          };

          function categorize(styles, group) {
            return styles.filter(s => group.includes(s)).sort();
          }

          const formStyles = categorize(rawStyles, categories.form);
          const holdStyles = categorize(rawStyles, categories.holds);
          const otherStyles = categorize(rawStyles, categories.other);

          const orderedStyles = [...formStyles, ...holdStyles, ...otherStyles];

          if (orderedStyles.length) {
            const styleEl = document.createElement('p');
            styleEl.className = 'problem-style';
            styleEl.textContent = orderedStyles.map(word =>
              word === 'game' ? 'GAME' : word
            ).join(', ');
            faNameEl.insertAdjacentElement('afterend', styleEl);
          }
        }

        const additionalInfo = problem[23]?.v || '';
        const additionalEl = document.getElementById('problem-additional');

        const relatedClimbsRaw = problem[24]?.v || '';
        const relatedClimbs = relatedClimbsRaw.split(';').map(name => name.trim()).filter(Boolean);

        // Build a map of problem names → grade from all rows
        const allProblems = Object.fromEntries(
          rows
            .map(r => r.c)
            .filter(cols => cols[8]?.v && cols[9]?.v)
            .map(cols => [cols[8].v.trim(), cols[9].v.trim()])
        );

        let relatedHTML = '';
        if (relatedClimbs.length > 0) {
          const links = relatedClimbs.map(climb => {
            const grade = allProblems[climb] || '';
            return `<a href="problem.html?name=${encodeURIComponent(climb)}" class="caption-name-link">
                      ${climb}
                    </a>
                    <span style="font-weight: bold; margin-left: 4px;">${grade}</span>`;
          }).join(' <span style="color: #555; font-size: 120%;">|</span> ');

          relatedHTML = `
            <div style="margin-bottom: 18px;">
              <span style="font-weight: bold; font-size: 13px; color: #666;">Related Climbs</span>
              <div style="margin-top: 4px;">${links}</div>
            </div>
          `;
        }

        let formatted = '';
        if (additionalInfo) {
          formatted = additionalInfo
            .split(';')
            .map(part => {
              let raw = part.trim();

              // Extract [bracketed] text if present
              const bracketMatch = raw.match(/\[(.*?)\]/);
              const bracketText = bracketMatch ? bracketMatch[1].trim() : '';
              const otherText = raw.replace(/\[.*?\]/, '').trim();

              // Run formatting on the "other" part
              let formattedOther = otherText;

              formattedOther = formattedOther.replace(/"(.*?)"/g, (_, match) =>
                `<span style="font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 14px;">${match}</span>`
              );

              formattedOther = formattedOther.replace(/!(.*?)!/g, (_, match) =>
                `<span style="font-weight: bold; font-style: italic; color: #f79646;">${match}</span>`
              );

              // Final HTML
              const bracketHTML = bracketText
                ? `<div style="font-weight: bold; font-size: 13px; color: #666;">${bracketText}</div>`
                : '';

              const otherHTML = formattedOther
                ? `<div style="margin-top: 2px;">${formattedOther}</div>`
                : '';

              return `<div style="margin-bottom: 6px;">${bracketHTML}${otherHTML}</div>`;
            })
            .join('');
        }

        // ✅ Show box if either has content
        if (relatedClimbs.length > 0 || additionalInfo) {
          additionalEl.innerHTML = relatedHTML + formatted;
          additionalEl.style.display = 'block';
        } else {
          additionalEl.style.display = 'none';
        }

        imageList = (problem[18]?.v || '').split(';').flatMap(part => part.split(',')).map(s => s.trim()).filter(Boolean);
        captionList = (problem[19]?.v || '').split(';').map(s => s.trim());
        const imageContainer = document.getElementById('problem-images');
        const videoLinks = (problem[17]?.v || '').split(';').map(link => link.trim()).filter(Boolean);
        const imageContainerParent = document.querySelector('.problem-images-container');

        if (videoLinks.length > 0 && imageContainerParent) {
          videoLinks.forEach(link => {
            const iframe = document.createElement('iframe');
            iframe.src = transformToEmbedURL(link);
            iframe.width = '100%';
            iframe.height = '315';
            iframe.style.border = 'none';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            iframe.style.marginTop = '20px';
            imageContainerParent.appendChild(iframe);
          });
        }

        imageList.forEach((url, index) => {
          if (url) {
            const img = document.createElement('img');
            img.src = toDirectImgurURL(url);
            img.alt = problemName;
            img.style.cursor = 'pointer';
            img.onerror = () => img.remove();

            img.addEventListener('click', () => {
              showImage(index);
            });

            imageContainer.appendChild(img);
          }
        });
      });

    document.addEventListener('DOMContentLoaded', () => {
      const lightbox = document.getElementById('lightbox');
      lightbox.addEventListener('click', () => {
        lightbox.style.display = 'none';
      });

      document.addEventListener('keydown', (e) => {
        if (lightbox.style.display === 'flex') {
          if (e.key === 'ArrowRight') {
            const nextIndex = (currentImageIndex + 1) % imageList.length;
            showImage(nextIndex);
          } else if (e.key === 'ArrowLeft') {
            const prevIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
            showImage(prevIndex);
          } else if (e.key === 'Escape') {
            lightbox.style.display = 'none';
          }
        }
      });
    });

    function transformToEmbedURL(url) {
      if (url.includes('youtube.com/watch?v=')) {
        return url.replace('watch?v=', 'embed/');
      }
      if (url.includes('youtu.be/')) {
        return url.replace('youtu.be/', 'youtube.com/embed/');
      }
      if (url.includes('vimeo.com/')) {
        const id = url.split('/').pop();
        return `https://player.vimeo.com/video/${id}`;
      }
      return url;
    }
  </script>

  <div id="lightbox" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); flex-direction:column; justify-content:center; align-items:center; z-index:1000;">
    <img id="lightbox-img" src="" alt="Full image" style="max-width:90vw; max-height:80vh; border-radius:8px;" />
    <p id="lightbox-caption" style="color:#ccc; margin-top:10px; font-size:14px; text-align:center; max-width:90vw;"></p>
  </div>

  <script src="search.js"></script>
  
</body>
</html>
